# Desktop-app overlay: register the integrated Git viewer plugins.
#
# - `git` is the host half: a `/git` HTTP JSON API running `git` in the
#   requested directory (status / diff / log / commit / push / pull).
# - `ui-git` is the browser half: a sidebar-foot Git button that opens a
#   panel bound to the current session's working directory.
- insert:
    - id: git
      name: '@deepseek-ai/dsh-git'

    - id: ui-git
      name: '@deepseek-ai/dsh-client-ui-git'
