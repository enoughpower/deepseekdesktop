# Desktop-app overlay: register the dsh-skills global skill hub.
#
# dsh-skills (CocoSgt) replaces the previous read-only dsh-skill-manager.
# It aggregates Claude Code / project / .skill-package skills into the global
# library at ~/.dsh/skills (the official skill-filesystem scan root, rank 400,
# live-watched, slash-menu in the composer). It manages skills: create / edit
# SKILL.md inline / upload .skill / export / open directory / delete, and
# imports as reference (symlink) or copy, plus a discover tab to scan sources.
# This mirrors the package's own cordis.patch.yml row so the desktop overlay
# stays a single --patch layer, same convention as git/billing/web-shell.
- insert:
    - id: skill-hub
      name: 'dsh-skills'