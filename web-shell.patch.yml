# Desktop-app overlay: register the built-in web shell plugin.
#
# dsh-web-shell is an out-of-tree plugin that docks an interactive xterm.js
# terminal (bash/zsh) to the right edge of the web GUI, bridged to a real host
# PTY over a WebSocket route (/api/shell). The host half mounts the PTY bridge
# via ctx.subprocess.spawnTerminal behind the webRuntime trust fence; the
# browser half is served by the client-modules scanner from this single row.
#
# This mirrors the plugin's own cordis.patch.yml row so the desktop overlay
# stays a single, self-contained --patch layer (same convention as git /
# billing / updater / skill-manager).
- insert:
    - id: web-shell
      name: 'dsh-web-shell'
      inject: [webServer, subprocess, webRuntime]
      config:
        # Default working directory for freshly spawned shells.
        cwd: /Users/dale/Desktop/workspace/desktop
        shells: [bash, zsh]
        defaultShell: bash
        rows: 40
        cols: 120
        graceMs: 5000
        fontFamily: '"Maple Mono NF CN", "Sarasa Mono SC", "Cascadia Code", "JetBrains Mono", "Noto Sans Mono CJK SC", "Microsoft YaHei UI", monospace'